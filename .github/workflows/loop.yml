name: Loop Script Tests
# The tests load the scripts under loop/ and lint every SKILL.md in the repo.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: loop/tests/requirements.txt
      - name: Install dependencies
        run: pip install -r loop/tests/requirements.txt
      - name: Run loop script tests
        run: python -m pytest loop/tests -q
